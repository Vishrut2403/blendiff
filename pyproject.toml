[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "blendiff/__init__.py"

[project]
name = "blendiff"
# Read from blendiff/__init__.py — see [tool.hatch.version] below. Stating the
# version in more than one file is what let three of them drift apart.
dynamic = ["version"]
description = "Semantic diff, snapshot history, and assisted merge for Blender .blend files"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Vishrut", email = "" }]
requires-python = ">=3.10"
keywords = ["blender", "diff", "3d", "vfx", "pipeline", "addon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Version Control",
]

# Pure-Python core only — no bpy required
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
blendiff = "blendiff.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/Vishrut2403/blendiff"
Repository = "https://github.com/Vishrut2403/blendiff"
"Bug Tracker" = "https://github.com/Vishrut2403/blendiff/issues"

[tool.hatch.build.targets.wheel]
# Ship the whole package, including ui/ and extractor/.
#
# The addon zip and the wheel are the same code, differing only in delivery.
# Excluding modules previously broke a real workflow: `pip install blendiff`
# into Blender's own Python could not capture snapshots, because extractor/
# was missing — even though every module in it imports bpy lazily and imports
# fine without Blender.
#
# ui/ does import bpy at module scope, but blendiff/__init__ guards that, so
# shipping it costs a non-Blender user nothing and lets someone who installed
# via pip inside Blender call blendiff.register() from the Scripting tab.
packages = ["blendiff"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "*.pyc",
    "blendiff.zip",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs inside a real Blender via tests/integration/run_in_blender.py",
]