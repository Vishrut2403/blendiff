name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Authentication is via PyPI Trusted Publishing (OpenID Connect): GitHub mints
# a short-lived token for this specific workflow, and PyPI verifies it against
# the publisher registered on the project. There is no long-lived API token
# stored anywhere, so there is nothing to leak or rotate.
#
# To cut a release:
#   1. bump __version__ in blendiff/__init__.py
#   2. update CHANGELOG.md
#   3. git tag -a v0.7.0 -m "v0.7.0" && git push origin v0.7.0

on:
  push:
    tags: ["v*"]

# Default to read-only; the publish job opts into id-token explicitly.
permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The tag is the only thing a human types, and blendiff/__init__.py is
      # the single source of the version. If they disagree, the release would
      # publish a version nobody expects — fail loudly instead.
      - name: Compare tag to __version__
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; \
            print(re.search(r'__version__ = \"([^\"]+)\"', \
            pathlib.Path('blendiff/__init__.py').read_text()).group(1))")
          echo "tag=$TAG  package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match __version__ $PKG in blendiff/__init__.py"
            exit 1
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"

      # Only the Blender-free tier gates the release. The integration tier
      # already runs on every push to main, and downloading Blender here would
      # add minutes to a release for coverage that has not changed since.
      - run: pytest tests/ -q -m "not integration"

  build:
    name: Build distributions
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check metadata
        run: |
          pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest

    # Must match the environment name registered on the PyPI publisher, and an
    # environment of this name must exist in the repository settings.
    environment:
      name: pypi
      url: https://pypi.org/project/blendiff/

    permissions:
      # This is what replaces the API token. It lets the job request an OIDC
      # identity token that PyPI trusts. Nothing else in the workflow needs it,
      # which is why publishing is a separate job with no source checkout.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  release-assets:
    name: Attach addon zip to the GitHub release
    needs: [publish]
    runs-on: ubuntu-latest

    permissions:
      # Creating a release and uploading an asset are writes to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        run: |
          set -euo pipefail
          VERSION="4.2.1"
          URL="https://download.blender.org/release/Blender4.2/blender-${VERSION}-linux-x64.tar.xz"
          mkdir -p "$HOME/blender"
          curl -fsSL "$URL" | tar -xJ -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      # The PyPI wheel deliberately excludes ui/ and extractor/, because they
      # require bpy. This zip is therefore the only way to install the Blender
      # addon, and shipping a release without it leaves addon users with
      # nothing to download.
      # Blender 4.2+ installs extensions; older versions install the legacy
      # addon zip. Both are published, since the manifest requires 4.2 while
      # bl_info still supports 3.6.
      - name: Build Blender extension
        id: extension
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ext-build
          blender --command extension build \
            --source-dir blendiff --output-dir ext-build
          mv "ext-build/blendiff-${VERSION}.zip" "blendiff-${VERSION}-extension.zip"
          echo "zip=blendiff-${VERSION}-extension.zip" >> "$GITHUB_OUTPUT"

      - name: Build addon zip
        id: zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="blendiff-${VERSION}.zip"

          # git archive reads from the commit, so untracked files, build
          # artifacts and __pycache__ cannot leak into the addon. The prefix
          # gives the single top-level blendiff/ folder Blender expects.
          git archive --format=zip --prefix=blendiff/ HEAD:blendiff -o "$ZIP"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Verify zip layout
        run: |
          python - "${{ steps.zip.outputs.zip }}" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          problems = []
          if not all(n.startswith("blendiff/") for n in names):
              problems.append("entries are not under a single blendiff/ folder")
          if "blendiff/__init__.py" not in names:
              problems.append("missing blendiff/__init__.py")
          for required in ("/ui/", "/extractor/"):
              if not any(required in n for n in names):
                  problems.append(f"missing {required} — the addon would not run")
          if any("__pycache__" in n for n in names):
              problems.append("contains __pycache__")
          if problems:
              sys.exit("Bad addon zip: " + "; ".join(problems))
          print(f"addon zip OK — {len(names)} entries")
          PY

      # Pull just this version's section out of the changelog, so the release
      # notes match what shipped without anyone retyping them.
      - name: Extract release notes
        run: |
          set -euo pipefail
          awk -v ver="${{ steps.zip.outputs.version }}" '
            $0 ~ "^## " ver "([^0-9]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No changelog section for ${{ steps.zip.outputs.version }}; using a placeholder."
            echo "See CHANGELOG.md for details." > release-notes.md
          fi

      # Idempotent: the release may already exist if it was created by hand
      # before the workflow ran, and re-running must not fail.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ZIP="${{ steps.zip.outputs.zip }}"

          EXT="${{ steps.extension.outputs.zip }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — attaching the zips."
            gh release upload "$TAG" "$ZIP" "$EXT" --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" "$ZIP" "$EXT" \
              --title "$TAG" \
              --notes-file release-notes.md
          fi
