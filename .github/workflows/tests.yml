name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      # The pure-Python core must stay testable without Blender — that is what
      # keeps the diff engine fast to iterate on.
      - name: Run unit tests
        run: pytest tests/ -v -m "not integration"

  integration:
    name: Integration tests (Blender ${{ matrix.blender }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The extractor is the only bpy-facing code and the only place Blender
        # API drift can bite, so it is tested against more than one version.
        blender: ["4.2.1", "5.1.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ matrix.blender }}"
          SERIES="${VERSION%.*}"
          URL="https://download.blender.org/release/Blender${SERIES}/blender-${VERSION}-linux-x64.tar.xz"
          mkdir -p ~/blender
          curl -fsSL "$URL" | tar -xJ -C ~/blender --strip-components=1

      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libsm6

      - name: Run integration tests
        env:
          BLENDER_BINARY: /home/runner/blender/blender
        run: pytest tests/integration -v

      # The addon suite drives the operators, panels and the Applier against
      # real bpy. It is the only coverage that layer has.
      - name: Run addon end-to-end suite
        env:
          BLENDER_BINARY: /home/runner/blender/blender
        run: pytest tests/integration -v -k AddonEndToEnd

  package:
    name: Package builds and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      # The published wheel ships only the pure-Python core. This guards the
      # mismatch where blendiff/__init__ imported the excluded UI package and
      # crashed on import inside Blender's own Python.
      - name: Verify the wheel imports without Blender
        run: |
          pip install dist/*.whl
          cd /tmp
          python -c "
          import blendiff
          from blendiff.diff_engine.diff_engine import DiffEngine
          from blendiff.merge_engine.merge_engine import MergeEngine
          from blendiff.export.html_exporter import generate_html
          print('core imports OK', blendiff.__version__)
          "
          blendiff --help
