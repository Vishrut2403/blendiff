schema_version = "1.0.0"

id = "blendiff"
name = "BlenDiff"
tagline = "See exactly what changed between versions of a .blend"
version = "0.8.2"
type = "add-on"

maintainer = "Vishrut Sachan <vishrutsachan2004@gmail.com>"
website = "https://github.com/Vishrut2403/blendiff"

tags = ["Pipeline", "Development"]

# Extensions are a Blender 4.2+ feature. Older versions install the legacy
# addon zip from GitHub Releases instead, which is why bl_info still declares
# a lower minimum.
blender_version_min = "4.2.0"

# The platform requires add-ons to be GPL-3.0-or-later: anything using the bpy
# API is treated as a derivative of Blender, which is itself GPL.
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Vishrut Sachan"]

[permissions]
# BlenDiff stores snapshot history in a .blendiff JSON sidecar next to the
# .blend file, and writes HTML reports where the user asks. It reads and
# writes nothing else, and needs no network access.
files = "Read and write .blendiff snapshot files and HTML reports"

[build]
# Keep the shipped extension to just the add-on. Tests, caches and packaging
# metadata are not useful to an artist and only inflate the download.
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.pyc",
  "/tests/",
  "/docs/",
  "*.blend1",
]
